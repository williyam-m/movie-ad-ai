name: quality-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint Python
        run: ruff check backend scripts tests

      - name: Test Python
        env:
          ENABLE_ASR: 'false'
          ENABLE_VLM: 'false'
          ENABLE_SEMANTIC_MODEL: 'false'
        run: pytest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build